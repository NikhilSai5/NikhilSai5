# Place this file at:  .github/workflows/snake.yml
# inside your NikhilSai5/NikhilSai5 profile repository (create the
# .github/workflows/ folders if they don't exist yet).
#
# It regenerates the contribution snake once a day, and whenever you push
# to main, then publishes the SVGs to an "output" branch — which is what
# the <picture> tag in README.md points to. No further action needed
# after adding this file; GitHub runs it automatically.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at midnight UTC
  workflow_dispatch:        # lets you also run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
